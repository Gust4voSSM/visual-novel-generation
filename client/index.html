<!doctype html>
<html lang="pt-BR" class="boot">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Roteiro VN</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: cast rail (left) · node canvas with floating HUD (center) · isolated AI chat (right). Single dark world, deliberately. */
:root{
  --ink:#111214; --surface:#1c1d21; --surface-2:#24252a; --well:#151619; --line:#2f3137; --line-2:#292b30; --line-3:#34363d;
  --text:#e7e5e0; --text-2:#b9bbc1; --muted:#8d8f96; --faint:#6f7179;
  --amber:#f2a541; --amber-hi:#ffb95c; --amber-soft:#f2c48a; --amber-bg:#33302a;
  --violet:#a78bfa; --violet-hi:#c4b5fd; --violet-ink:#ddd0ff; --violet-bg:#2c2544; --teal:#5eead4; --pink:#f0abfc;
  --blue:#6cb6ff; --red:#ff6b6b; --red-bg:#4a1f24;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--sans);font-size:13px;overflow:hidden;margin:0}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
::selection{background:rgba(167,139,250,.35)}
.app{--rwf:300px;--cwf:330px;--rw:var(--rwf);--cw:var(--cwf);display:grid;grid-template-columns:var(--rw) minmax(0,1fr) var(--cw);grid-template-rows:minmax(0,1fr);height:100%;transition:grid-template-columns .42s cubic-bezier(.2,1,.3,1);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.app.rail-off{--rw:0px}.app.chat-off{--cw:0px}
.app.no-anim,.app.no-anim .rail,.app.no-anim .chat,.app.no-anim .rail>*,.app.no-anim .chat>*{transition:none!important}
.rail,.chat{overflow:hidden;min-width:0;transition:opacity .3s ease,box-shadow .3s}
.rail>*{width:var(--rwf);flex-shrink:0;transition:transform .42s cubic-bezier(.2,1,.3,1)}
.chat{align-items:flex-end}
.chat>*{width:var(--cwf);flex-shrink:0;transition:transform .42s cubic-bezier(.2,1,.3,1)}
.app.rail-off .rail{opacity:0;pointer-events:none}.app.rail-off .rail>*{transform:translateX(-28px)}
.app.chat-off .chat{opacity:0;pointer-events:none}.app.chat-off .chat>*{transform:translateX(28px)}
.ptoggle{height:36px;width:36px;padding:0;justify-content:center;color:var(--text-2);cursor:pointer;transition:color .15s,box-shadow .15s,transform .15s}
.ptoggle:hover{color:var(--text);box-shadow:inset 0 0 0 1px var(--amber)}
.ptoggle:active{transform:scale(.92)}
.ptoggle svg{width:17px;height:17px}
.ptoggle .chev{transition:transform .35s cubic-bezier(.2,1.4,.4,1);transform-origin:12px 12px;transform-box:view-box}
.ptoggle[aria-expanded="false"] .chev{transform:scaleX(-1)}
.ptoggle[aria-expanded="false"]{color:var(--amber-soft)}
/* ---------- shared bits ---------- */
.mono{font-family:var(--mono)}
.chip{border:0;background:rgba(28,29,33,.92);box-shadow:inset 0 0 0 1px var(--line);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--text-2);display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.kbd{font-family:var(--mono);font-size:11.5px;padding:1px 6px;border-radius:4px;background:var(--violet-bg);color:var(--violet-ink);box-shadow:inset 0 -1px 0 #4a3f78}
.dotport{width:10px;height:10px;border-radius:50%;border:2px solid var(--amber);display:inline-block}
.tag{font-family:var(--mono);font-size:11px;padding:2px 6px;border-radius:4px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.tag.start{background:var(--amber-bg);color:var(--amber-soft)}
.tag.ai{background:var(--violet-bg);color:var(--violet-ink)}
.tag.final{background:#26282e;color:#9a9ca3}
.tag.warn{background:#3a2a1c;color:#ffc98a}
.tag svg{width:11px;height:11px}
.iconbtn{width:28px;height:28px;border-radius:6px;border:0;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none}
.iconbtn:hover{background:var(--line);color:var(--text)}
.iconbtn svg{width:14px;height:14px}
.iconbtn.sm{width:24px;height:24px}
.addbtn{height:28px;padding:0 10px;border-radius:6px;background:transparent;border:1px dashed #40434a;color:#b4b6bc;font-size:12.5px;white-space:nowrap;transition:color .12s,border-color .12s,background .12s,box-shadow .12s}
.addbtn:hover{border-color:var(--amber);color:var(--amber-soft)}
.addbtn.ai:hover{border-color:var(--violet);color:var(--violet-ink)}
.addbtn.primed,.addbtn.primed:hover{border-style:solid;border-color:var(--violet-hi);color:#f1eaff;background:rgba(76,58,140,.35);box-shadow:0 0 16px rgba(167,139,250,.55);animation:addpop .36s cubic-bezier(.2,1.6,.4,1) both}
@keyframes addpop{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1.05)}}
.btn{height:32px;padding:0 12px;border-radius:7px;border:1px solid var(--line-3);background:transparent;color:#d6d4cf;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--amber);color:var(--amber-soft)}
.btn:disabled{opacity:.4;cursor:default;border-color:var(--line-3);color:#d6d4cf}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#1a1308;font-weight:600}
.btn.primary:hover{background:var(--amber-hi);color:#1a1308}
.btn.violet{border-color:rgba(167,139,250,.55);color:var(--violet-ink)}
.btn.violet:hover{border-color:var(--violet-hi);background:rgba(76,58,140,.3);box-shadow:0 0 14px rgba(167,139,250,.35);color:#f1eaff}
.btn.violet.solid{background:var(--violet);border-color:var(--violet);color:#160f2c;font-weight:600}
.btn.danger:hover{border-color:var(--red);color:#ff8a8a}
.btn.danger.solid{background:var(--red);border-color:var(--red);color:#2b0b0e;font-weight:600}
.btn.danger.solid:hover{background:#ff8585;border-color:#ff8585;color:#2b0b0e}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px;border-radius:6px}
.inp{height:30px;background:var(--well);border:1px solid var(--line);border-radius:6px;color:var(--text);font-size:13px;padding:0 8px;width:100%;min-width:0;outline:none}
.inp:focus{border-color:var(--amber)}
textarea.inp{height:auto;min-height:56px;padding:6px 8px;line-height:1.45;resize:vertical}
select.inp{padding:0 6px}
.lbl{font-family:var(--mono);font-size:11px;color:#83858c}
.hint{font-size:12px;color:var(--muted);line-height:1.5}
.field{display:flex;flex-direction:column;gap:5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* ---------- left rail ---------- */
.rail,.chat{background:#16171a;display:flex;flex-direction:column;min-height:0;position:relative;z-index:3}
.rail{box-shadow:inset -1px 0 0 var(--line-2)}
.chat{box-shadow:inset 1px 0 0 var(--line-2)}
.rail-top{padding:16px 16px 0;display:flex;flex-direction:column;gap:12px}
.brand{display:flex;align-items:baseline;gap:8px;color:var(--text)}
.brand strong{font-weight:600;font-size:14px}
.brand span{color:var(--muted);font-size:12.5px}
.title-in{height:32px;background:transparent;border:1px solid transparent;border-radius:6px;font-weight:600;font-size:14px;padding:0 8px;margin-left:-8px;width:calc(100% + 8px);outline:none}
.title-in:hover{border-color:var(--line-3)}
.title-in:focus{border-color:var(--blue);background:var(--well)}
.tabs{display:flex;gap:4px;padding:2px;background:var(--well);border-radius:8px;box-shadow:inset 0 0 0 1px var(--line)}
.tab{flex:1;height:30px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.tab[aria-selected="true"]{background:var(--surface-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line-3)}
.tab .n{font-family:var(--mono);font-size:11px;color:var(--faint)}
.rail-actions{display:flex;gap:6px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.rail-body{flex:1;overflow:auto;padding:12px 16px 24px;display:flex;flex-direction:column;gap:8px;min-height:0}
.card{background:var(--surface);border-radius:10px;box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .2s}
.card.fresh{animation:cardin .5s cubic-bezier(.2,1.3,.4,1) both}
.card.fresh.ai{box-shadow:inset 0 0 0 1px rgba(167,139,250,.6),0 0 24px rgba(139,92,246,.35)}
@keyframes cardin{0%{opacity:0;transform:translateY(-8px) scale(.96)}100%{opacity:1;transform:none}}
.card-row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;cursor:pointer}
.card-row:hover{background:var(--surface-2)}
.avatar{width:40px;height:40px;border-radius:7px;background:var(--surface-2);object-fit:cover;object-position:top;flex:none}
.bg-thumb{width:64px;height:36px;border-radius:6px;object-fit:cover;flex:none}
.card-name{font-weight:600;display:flex;align-items:center;gap:6px;min-width:0}
.card-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-sub{font-family:var(--mono);font-size:11px;color:#83858c}
.swatch{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.chev{color:var(--faint);font-family:var(--mono);font-size:11px}
.card-edit{padding:10px 12px 12px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line-2)}
.sprite{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:start;padding:6px;border-radius:8px;background:var(--well);box-shadow:inset 0 0 0 1px var(--line)}
.sprite img{width:52px;height:68px;object-fit:contain;object-position:bottom;border-radius:5px;background:var(--surface-2)}
.sprite .inp{height:26px;font-size:12px}
.artgen{display:flex;align-items:center;justify-content:center;background:var(--surface-2);border-radius:5px;color:#ffb4a8;font-weight:700}
.sprite .artgen{width:52px;height:68px}
.avatar.artgen,.bg-thumb.artgen{flex:none}
.artgen.failed{background:#3a1f22}
.genline{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--text-2)}
.genline.failed{color:#ffb4a8}
.genline .addbtn{padding:2px 7px;font-size:11px}
.sprite.fresh{animation:rowpop .5s cubic-bezier(.2,1.4,.4,1) both}
.sprite-f{display:flex;flex-direction:column;gap:4px;min-width:0}
.empty{font-size:12.5px;color:var(--muted);line-height:1.5;padding:8px 2px}
/* ---------- canvas ---------- */
.canvas{container-type:size;position:relative;overflow:hidden;background:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none;min-width:0}
.canvas.panning{cursor:grabbing}
.canvas input,.canvas textarea,.canvas select{user-select:text;-webkit-user-select:text}
.grid{position:absolute;inset:0;background-image:radial-gradient(#2b2d33 1px,transparent 1.3px);pointer-events:none}
.shaker{position:absolute;inset:0}
.shaker.shake{animation:shake .38s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{10%,90%{transform:translate(-1px,1px)}20%,80%{transform:translate(3px,-2px)}30%,50%,70%{transform:translate(-5px,2px)}40%,60%{transform:translate(5px,-1px)}}
.world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0}
.wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.wpath{fill:none;stroke-linecap:round}
.eglow{fill:none;filter:blur(7px);stroke-linecap:round}
.spark{fill:#f5f0ff;filter:drop-shadow(0 0 4px #a78bfa) drop-shadow(0 0 2px #a78bfa)}
.fx{position:absolute;left:0;top:0;width:0;height:0}
.wash{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;box-shadow:inset 0 0 180px 24px rgba(139,92,246,.3);z-index:2}
.wash.on{opacity:1}
/* node */
.node{position:absolute;width:300px;display:flex;flex-direction:column;background:var(--surface);border-radius:10px;box-shadow:inset 0 0 0 1px var(--line),0 12px 32px rgba(0,0,0,.4);transform-origin:0 20px;transition:box-shadow .35s,opacity .25s}
.node.ai{box-shadow:inset 0 0 0 1px rgba(167,139,250,.55),0 12px 32px rgba(0,0,0,.4)}
.node.unreach{opacity:.55}
.node.target{box-shadow:inset 0 0 0 2px var(--amber),0 0 0 4px rgba(242,165,65,.18),0 12px 32px rgba(0,0,0,.4)}
.node.target.bad{box-shadow:inset 0 0 0 2px var(--red),0 0 0 4px rgba(255,107,107,.18),0 12px 32px rgba(0,0,0,.4)}
.node.sel{box-shadow:inset 0 0 0 2px var(--blue),0 0 0 4px rgba(108,182,255,.2),0 12px 32px rgba(0,0,0,.4)}
.node.primed{box-shadow:inset 0 0 0 1px rgba(167,139,250,.65),0 0 30px 2px rgba(139,92,246,.35),0 12px 32px rgba(0,0,0,.4)}
.node.landed{box-shadow:inset 0 0 0 2px var(--violet-hi),0 0 40px 6px rgba(139,92,246,.55),0 12px 32px rgba(0,0,0,.4)}
.node.landed-plain{box-shadow:inset 0 0 0 2px var(--amber),0 0 26px 2px rgba(242,165,65,.3),0 12px 32px rgba(0,0,0,.4)}
.node.pop{animation:pop .42s cubic-bezier(.2,1.3,.4,1) both}
.node.pop-ai{animation:popai .7s cubic-bezier(.2,1.5,.35,1) both}
.node.gen{animation:popai .7s cubic-bezier(.2,1.5,.35,1) both,glowpulse 1.3s ease-in-out .7s infinite}
.node.err{animation:nshake .38s cubic-bezier(.36,.07,.19,.97) both}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes popai{0%{transform:scale(.35) rotate(-4deg);opacity:0;filter:brightness(2.4)}55%{transform:scale(1.05) rotate(.5deg);opacity:1}100%{transform:scale(1) rotate(0);filter:brightness(1)}}
@keyframes glowpulse{0%,100%{box-shadow:inset 0 0 0 1px #a78bfa,0 0 22px 2px rgba(167,139,250,.45),0 12px 32px rgba(0,0,0,.4)}50%{box-shadow:inset 0 0 0 1px #5eead4,0 0 34px 6px rgba(94,234,212,.35),0 12px 32px rgba(0,0,0,.4)}}
@keyframes nshake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.nhead{height:40px;flex:none;display:flex;align-items:center;gap:6px;padding:0 6px 0 16px;background:var(--surface-2);border-radius:10px 10px 0 0;position:relative}
.node{cursor:grab}
.node textarea,.node select,.node .oin{cursor:auto}
.node .ntitle{cursor:grab}.node .ntitle:focus{cursor:text}
.node button,.node label{cursor:pointer}
.node .port.out{cursor:crosshair}
.canvas img{-webkit-user-drag:none;user-drag:none}
.canvas.moving,.canvas.moving *{cursor:grabbing!important}
.node.lifting{transform:translateY(-3px) scale(1.012);box-shadow:inset 0 0 0 2px var(--blue),0 0 0 4px rgba(108,182,255,.2),0 26px 50px rgba(0,0,0,.55);transition:transform .16s cubic-bezier(.2,1.4,.4,1),box-shadow .2s;z-index:5}
.node.dropped{animation:drop .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes drop{0%{transform:translateY(-3px) scale(1.012)}60%{transform:translateY(1px) scale(.997)}100%{transform:none}}
.ntitle{flex:1;min-width:0;height:26px;background:transparent;border:1px solid transparent;border-radius:6px;font-size:13px;font-weight:600;padding:0 6px;margin-left:-6px;outline:none;letter-spacing:.01em}
.ntitle:hover{border-color:#3a3d44}
.ntitle:focus{border-color:var(--blue);background:var(--well)}
.sec{padding:10px 12px;border-top:1px solid var(--line-2);display:flex;flex-direction:column;gap:8px}
.sec:first-of-type{border-top:0}
.mid{overflow:hidden}
.sum{font-size:13px;line-height:1.45;color:var(--text);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.sum .who{font-weight:600;margin-right:6px}
.sum .narr{font-style:italic;color:#d5d1c8}
.none{color:var(--faint);font-style:italic}
.orow.c{height:34px}
.olabel{flex:1;min-width:0;font-size:13px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orow.c.optgen .olabel{color:#efeaff;text-shadow:0 0 10px rgba(167,139,250,.7)}
.ntoggle svg{transition:transform .3s cubic-bezier(.2,1.4,.4,1)}
.ntoggle[aria-expanded="true"] svg{transform:rotate(180deg)}
.node:not(.exp):hover{box-shadow:inset 0 0 0 1px #45484f,0 12px 32px rgba(0,0,0,.4)}
.node.exp{z-index:3}
.node.opening .grow-in{animation:growin .36s cubic-bezier(.2,1,.3,1) both}
.node.opening .grow-in+.grow-in{animation-delay:.04s}
.node.opening .nfoot.grow-in{animation-delay:.08s}
@keyframes growin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.node.closing .mid{animation:none}
.stage-mini{position:relative;aspect-ratio:16/9;border-radius:7px;overflow:hidden;background:var(--well);box-shadow:inset 0 0 0 1px var(--line)}
.stage-mini>.bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage-mini .nobg{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:var(--faint);background:repeating-linear-gradient(135deg,transparent 0 10px,rgba(255,255,255,.02) 10px 20px)}
/* quadro 16:9 dos personagens (o palco tem a mesma proporção, recolhido ou aberto) */
.stage-frame{position:absolute;inset:0;pointer-events:none}
.pchar{position:absolute;bottom:0;height:96%;transform:translateX(-50%);object-fit:contain;object-position:bottom;pointer-events:auto;cursor:grab;touch-action:none;-webkit-user-drag:none;user-select:none;transition:filter .25s}
.pchar.dim{filter:brightness(.58) saturate(.8)}
.pchar.sel{filter:drop-shadow(0 0 1px #fff) drop-shadow(0 0 5px var(--amber))}
/* alça de tamanho do personagem selecionado */
.khandle{position:absolute;width:14px;height:14px;margin:0 0 -7px -7px;border-radius:50%;background:var(--amber);border:2px solid #141414;box-shadow:0 0 0 1px var(--amber);cursor:ns-resize;touch-action:none;z-index:3;pointer-events:auto}
.khandle::before{content:'';position:absolute;inset:-6px}
.khandle:hover::after,body.kscaling .khandle::after{content:attr(data-pct);position:absolute;left:50%;bottom:100%;transform:translate(-50%,-4px);padding:0 5px;border-radius:4px;background:#141414;color:var(--amber);font:600 10px var(--mono);white-space:nowrap}
body.kscaling,body.kscaling *{cursor:ns-resize!important}
.pchar.dim.sel{filter:brightness(.8) drop-shadow(0 0 1px #fff) drop-shadow(0 0 5px var(--amber))}
.pchar.hold{visibility:hidden}
/* onion skin: o personagem arrastado nas cenas vizinhas (âmbar = anterior, azul = seguinte) */
.onion{position:absolute;bottom:0;height:96%;transform:translateX(-50%);object-fit:contain;object-position:bottom;pointer-events:none;opacity:.32;filter:grayscale(1) brightness(1.4) drop-shadow(0 0 0 var(--oc)) drop-shadow(0 0 2px var(--oc));transition:opacity .15s,filter .15s;--oc:var(--amber)}
.onion.next{--oc:#6aa8ff}.onion.both{--oc:#c9a8ff}
.onion.hit{opacity:.6;filter:grayscale(1) brightness(1.6) drop-shadow(0 0 1px #fff) drop-shadow(0 0 6px var(--oc))}
.pchar.clash{filter:drop-shadow(0 0 1px #fff) drop-shadow(0 0 6px var(--red));animation:clash .5s ease-in-out infinite alternate}
@keyframes clash{to{filter:drop-shadow(0 0 1px #fff) drop-shadow(0 0 12px var(--red))}}
.stage-mini.drop-ok::after,.stage-mini.drop-bad::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:2}
.stage-mini.drop-ok::after{box-shadow:inset 0 0 0 2px var(--amber),inset 0 0 26px rgba(242,165,65,.35)}
.stage-mini.drop-bad::after{box-shadow:inset 0 0 0 2px var(--red),inset 0 0 26px rgba(240,80,80,.3)}
/* personagem que outra pessoa está arrastando, com o nome dela */
.rghost{position:fixed;left:0;top:0;z-index:94;pointer-events:none;user-select:none;will-change:transform;transition:opacity .25s}
.rghost img{display:block;width:auto;opacity:.85;filter:drop-shadow(0 0 1px var(--rc)) drop-shadow(0 0 4px var(--rc)) drop-shadow(0 10px 14px rgba(0,0,0,.4))}
.rghost span{position:absolute;left:50%;top:-4px;transform:translate(-50%,-100%);padding:1px 6px;border-radius:5px;background:var(--rc);color:#141414;font-size:11px;font-weight:600;white-space:nowrap}
.rghost.out{opacity:0}
.cghost{position:fixed;left:0;top:0;z-index:95;pointer-events:none;user-select:none;filter:drop-shadow(0 14px 18px rgba(0,0,0,.45));will-change:transform,clip-path,height}
body.chardrag,body.chardrag *{cursor:grabbing!important;user-select:none}
.castbar{display:flex;flex-direction:column;gap:6px}
.castbar.fresh{animation:rowpop .45s cubic-bezier(.2,1.4,.4,1) both}
.cb-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;min-width:0}
.cb-sprites{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.cb-sp{flex:none;width:56px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 3px 3px;border-radius:7px;border:1px solid var(--line);background:var(--well);color:var(--text-2);font-size:10.5px}
.cb-sp:hover{border-color:var(--line-3);color:var(--text)}
.cb-sp img{width:40px;height:42px;object-fit:cover;object-position:top}
.cb-sp span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb-sp[aria-pressed="true"]{border-color:var(--amber);color:var(--text);box-shadow:0 0 0 1px var(--amber)}
.castempty{border:1px dashed var(--line-3);border-radius:7px;padding:10px;text-align:center;font-size:12px;color:var(--faint)}
.spk{display:flex;gap:5px;flex-wrap:wrap;min-width:0}
.spk-chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px 0 3px;border-radius:13px;border:1px solid var(--line);background:var(--well);color:var(--text-2);font-size:12px}
.spk-chip img{width:20px;height:20px;border-radius:50%;object-fit:cover;object-position:top;background:var(--surface-2)}
.spk-chip[aria-pressed="true"]{border-color:var(--cc);color:var(--cc);background:color-mix(in srgb,var(--cc) 14%,transparent)}
.card[data-c] .card-row,.card[data-c] .sprite img{-webkit-user-drag:none;user-select:none}
.card[data-c] .avatar,.card[data-c] .sprite img{touch-action:none;cursor:grab}
.reveal .bgimg{animation:bgin .6s ease-out both}
.reveal .pchar{animation:charin .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes bgin{from{opacity:0;filter:brightness(2) saturate(.3)}to{opacity:1;filter:none}}
@keyframes charin{from{opacity:0;transform:translate(-50%,18%) scale(.92)}to{opacity:1;transform:translate(-50%,0)}}
.gen-veil{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:9px;padding:0 22px;background:rgba(44,37,68,.35)}
.skel{height:8px;border-radius:4px;background:linear-gradient(90deg,#2a2640 0%,#4a3f78 50%,#2a2640 100%);background-size:200% 100%;animation:shimmer 1s linear infinite}
@keyframes shimmer{from{background-position:200% 0}to{background-position:0 0}}
.msel{height:28px;background:var(--well);border:1px solid var(--line);border-radius:6px;color:var(--text);font-size:12.5px;padding:0 6px;width:100%;min-width:0;outline:none}
.msel:focus{border-color:var(--amber)}
.msel:disabled{opacity:.55}
.cast-name{font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;padding:2px;background:var(--well);border-radius:7px;box-shadow:inset 0 0 0 1px var(--line)}
.seg button{flex:1;height:24px;border:0;border-radius:5px;background:transparent;color:var(--muted);font-size:12px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line-3)}
.speaker{display:flex;align-items:center;gap:8px}
.speaker .lbl{white-space:nowrap}
.ntext{display:block;width:100%;min-height:70px;background:transparent;border:0;color:var(--text);font-size:14px;line-height:1.45;outline:none;padding:0;margin:0;resize:none;overflow:hidden;white-space:pre-wrap;field-sizing:content}
.ntext::placeholder{color:var(--faint)}
.ntext.narr{font-style:italic;color:#d5d1c8}
.ntext.typing{color:#efeaff}
.ntext.dialogue-q::before{content:"“";color:var(--muted)}
.caret{display:inline-block;width:7px;height:15px;background:var(--violet-hi);vertical-align:-2px;margin-left:2px;box-shadow:0 0 8px var(--violet);animation:blink .6s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.orow{height:40px;flex:none;display:flex;align-items:center;gap:6px;padding:0 20px 0 12px;position:relative;border-top:1px solid var(--line-2)}
.orow.fresh{animation:rowpop .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes rowpop{0%{opacity:0;transform:translateX(-14px)}100%{opacity:1;transform:none}}
.onum{font-family:var(--mono);font-size:11px;color:var(--muted);width:12px;flex:none}
.oin{flex:1;min-width:0;height:28px;background:var(--well);border:1px solid var(--line);border-radius:6px;color:var(--text);font-size:13px;padding:0 8px;outline:none}
.oin:focus{border-color:var(--amber)}
.orow.optgen .oin{border-color:var(--violet);color:#efeaff;box-shadow:0 0 12px rgba(167,139,250,.5)}
.orow.draft .oin{border-style:dashed}
.nextlabel{flex:1;text-align:right;font-family:var(--mono);font-size:12px;color:#9a9ca3;padding-right:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nfoot{height:40px;flex:none;display:flex;align-items:center;gap:6px;padding:0 12px;border-top:1px solid var(--line-2)}
.hintsm{font-family:var(--mono);font-size:11px;color:#83858c;margin-left:auto;white-space:nowrap}
.port{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;padding:0;border:2px solid var(--amber);background:var(--ink);transform:translate(-50%,-50%);transition:transform .12s,background .12s}
.port::after{content:"";position:absolute;inset:-9px;border-radius:50%}
.port.in{left:0;pointer-events:none}
.port.out{left:100%;cursor:crosshair}
.port.out:hover{transform:translate(-50%,-50%) scale(1.35)}
.port.linked{background:var(--amber)}
.port.draft{border-color:#ffc98a;border-style:dashed}
.node.ai .port.in.linked{background:var(--violet);border-color:var(--violet)}
.port.hot{transform:translate(-50%,-50%) scale(1.6);background:var(--amber);box-shadow:0 0 0 6px rgba(242,165,65,.25)}
.port.active{transform:translate(-50%,-50%) scale(1.3);background:var(--amber)}
.port.charging{border-color:#ede4ff;background:var(--violet);transform:translate(-50%,-50%) scale(1.45);animation:charge .7s ease-out infinite}
@keyframes charge{0%{box-shadow:0 0 0 0 rgba(167,139,250,.8)}100%{box-shadow:0 0 0 16px rgba(167,139,250,0)}}
.port.out.primed,.port.out.primed:hover{border-color:#ede4ff;background:var(--violet);animation:primepop .38s cubic-bezier(.2,1.6,.4,1) both,charge .8s ease-out .38s infinite}
.port.out.primed::before{content:"";position:absolute;inset:-8px;border-radius:50%;border:1.5px dashed var(--violet-hi);animation:spin 1.1s linear infinite}
@keyframes primepop{0%{transform:translate(-50%,-50%) scale(1)}40%{transform:translate(-50%,-50%) scale(1.8)}100%{transform:translate(-50%,-50%) scale(1.4)}}
@keyframes spin{to{transform:rotate(360deg)}}
.menu{position:absolute;right:6px;top:38px;z-index:20;background:var(--surface-2);border-radius:9px;box-shadow:inset 0 0 0 1px var(--line-3),0 12px 32px rgba(0,0,0,.5);padding:4px;display:flex;flex-direction:column;min-width:190px;animation:pop .2s ease-out}
.menu button{border:0;background:none;text-align:left;padding:8px 10px;border-radius:6px;font-size:13px;color:var(--text)}
.menu button:hover{background:var(--line)}
.menu button.danger:hover{background:var(--red-bg);color:#ff8a8a}
/* drag & fx */
.ghost{position:absolute;width:300px;height:230px;border-radius:10px;border:1.5px dashed #4a4d55;pointer-events:none;display:flex;flex-direction:column;gap:12px;padding:12px 16px;transform-origin:0 20px;transition:background .2s,border-color .2s,box-shadow .2s}
.ghostlabel{font-size:12.5px;color:#9a9ca3;display:flex;align-items:center;gap:6px;font-family:var(--mono)}
.ghostlabel svg{width:13px;height:13px}
.ghost .skel{display:none}
.ghost.shift{border:1.5px solid rgba(167,139,250,.85);background:rgba(76,58,140,.14);box-shadow:0 0 44px rgba(167,139,250,.35);animation:breath .9s ease-in-out infinite alternate}
.ghost.shift .ghostlabel{color:#e2d6ff}
.ghost.shift .skel{display:block}
@keyframes breath{from{transform:scale(1)}to{transform:scale(1.025)}}
.badge{position:absolute;pointer-events:none;font-family:var(--mono);font-size:12px;padding:6px 9px;border-radius:6px;background:#26282e;color:#d6d4cf;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;box-shadow:0 0 0 1px #34363d,0 6px 16px rgba(0,0,0,.4);z-index:30}
.badge.shift{background:#2a2142;color:#efe7ff;box-shadow:0 0 0 1px rgba(167,139,250,.7),0 0 22px rgba(167,139,250,.45)}
.badge.bad{background:var(--red-bg);color:#ffb3b3;box-shadow:0 0 0 1px rgba(255,107,107,.6)}
.badge svg{width:13px;height:13px}
.burst{position:absolute;width:0;height:0;pointer-events:none;z-index:25}
.ring{position:absolute;left:-7px;top:-7px;width:14px;height:14px;border-radius:50%;border:2px solid var(--amber);animation:ring .55s ease-out forwards}
.burst.ai .ring{border-color:var(--violet-hi);animation:ringai .8s ease-out forwards}
.burst.ai .ring.r2{border-color:var(--teal);animation-delay:.1s}
.burst.plain .ring.r2{display:none}
.burst.red .ring{border-color:var(--red)}
@keyframes ring{0%{transform:scale(1);opacity:1}100%{transform:scale(4.5);opacity:0}}
@keyframes ringai{0%{transform:scale(1);opacity:1}100%{transform:scale(11);opacity:0}}
.shardwrap{position:absolute;left:0;top:0;width:0;height:0}
.shard{position:absolute;left:0;top:-1.5px;height:3px;border-radius:2px;background:#ddd0ff;box-shadow:0 0 8px #a78bfa;transform-origin:0 50%;animation:fly cubic-bezier(.1,.8,.3,1) forwards}
@keyframes fly{0%{transform:translateX(4px) scaleX(.2);opacity:1}70%{opacity:1}100%{transform:translateX(90px) scaleX(1);opacity:0}}
.burst.mini .ring{animation:ringmini .4s ease-out forwards}
.burst.mini .ring.r2{display:none}
.burst.mini .shard{height:2px;top:-1px;animation-name:flymini}
@keyframes ringmini{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.6);opacity:0}}
@keyframes flymini{0%{transform:translateX(6px) scaleX(.3);opacity:1}100%{transform:translateX(22px) scaleX(1);opacity:0}}
.cutbtn{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;border:1px solid #3a3d44;background:var(--surface);color:var(--muted);padding:0;display:flex;align-items:center;justify-content:center;opacity:.55;transition:opacity .12s,background .12s,color .12s,transform .12s;z-index:4}
.cutbtn::after{content:"";position:absolute;inset:-10px}
.cutbtn svg{width:13px;height:13px}
.cutbtn:hover,.cutbtn:focus-visible{opacity:1;background:var(--red-bg);color:#ff8a8a;border-color:var(--red);transform:scale(1.15)}
.marquee{position:absolute;pointer-events:none;border:1px solid var(--blue);background:rgba(108,182,255,.1);border-radius:3px}
/* HUD */
.hud{position:absolute;left:16px;top:16px;right:16px;display:flex;gap:10px;align-items:center;pointer-events:none;z-index:6}
.hz{display:flex;align-items:center;gap:8px;min-width:0}
.hz>*{pointer-events:auto}
.hz-left{flex:1 1 0}
.hz-mid{flex:none;justify-content:center}
.hz-right{flex:1 1 0;justify-content:flex-end}
/* título + ⋯ + status de salvamento, num só bloco */
.titlebox{display:flex;align-items:center;gap:2px;min-width:0;height:36px;padding:0 4px 0 10px;background:rgba(28,29,33,.92);box-shadow:inset 0 0 0 1px var(--line);border-radius:8px}
.titlebox .title-in{width:auto;min-width:80px;max-width:300px;field-sizing:content;margin:0;height:28px;padding:0 6px;text-overflow:ellipsis}
.titlebox .iconbtn{flex:none}
.sync{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 8px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-size:12px;white-space:nowrap;flex:none}
.sync:hover{background:var(--line);color:var(--text-2)}
.sync .ndot{width:7px;height:7px}
.sync.on .ndot{background:#4ade80}
.sync.saving .ndot{background:var(--amber);animation:lockpulse 1s ease-in-out infinite}
.sync.off .ndot,.sync.err .ndot{background:var(--red)}
.sync.off,.sync.err{color:#ffb4b4}
.chip.share svg{width:15px;height:15px}
#btnExport svg{width:15px;height:15px}
/* popovers do topo (⋯ e atalhos): posicionados pelo JS logo abaixo do botão */
.hudpop{position:absolute;z-index:9}
.hudpop .menu{position:static;animation:pop .18s ease-out}
.helppop{width:320px;max-width:calc(100vw - 32px);background:var(--surface);border-radius:10px;box-shadow:inset 0 0 0 1px var(--line),0 16px 40px rgba(0,0,0,.5);padding:12px 14px;animation:pop .18s ease-out}
.helppop h3{margin:0 0 8px;font-size:13px;font-weight:600}
.helppop dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:baseline;font-size:12.5px;color:var(--text-2)}
.helppop dt{white-space:nowrap}
.helppop dd{margin:0}
/* telas estreitas: some primeiro o resumo do grafo, depois os avatares e os rótulos */
@container (max-width:1100px){.hz-mid{display:none}}
@container (max-width:860px){.people,.sync .slabel{display:none}.chip.share span{display:none}.chip.share{padding:8px 10px}}
@container (max-width:560px){#btnHelp{display:none}.titlebox .title-in{min-width:40px}}
.playbtn{height:36px;padding:0 14px;border-radius:8px;border:0;background:var(--amber);color:#1a1308;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:8px}
.playbtn:hover{background:var(--amber-hi)}
.playbtn svg{width:13px;height:13px}
.stats{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.stats .warnlink{border:0;background:none;color:#ffc98a;font:inherit;padding:0;text-decoration:underline dotted;text-underline-offset:3px}
.zoombar{position:absolute;left:16px;bottom:16px;display:flex;align-items:center;gap:2px;background:rgba(28,29,33,.92);box-shadow:inset 0 0 0 1px var(--line);border-radius:8px;padding:4px;z-index:6}
.zbtn{height:32px;min-width:32px;padding:0 8px;border:0;border-radius:6px;background:transparent;color:var(--text-2);font-family:var(--mono);font-size:13px;display:inline-flex;align-items:center;justify-content:center}
.zbtn:hover{background:var(--line);color:var(--text)}
.zbtn.pct{min-width:56px;font-size:12px}
.zbtn.center{gap:6px;font-family:var(--sans);font-size:12.5px;padding:0 10px}
.zbtn.center svg{width:15px;height:15px}
@container (max-width:560px){.zbtn.center span{display:none}}
.zbtn:disabled{opacity:.35;cursor:default;background:transparent}
.zsep{width:1px;height:18px;background:var(--line-3);margin:0 4px}
.selbar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:rgba(28,29,33,.96);box-shadow:inset 0 0 0 1px var(--line),0 12px 32px rgba(0,0,0,.45);border-radius:10px;padding:6px 8px 6px 14px;font-size:13px;color:var(--text-2);white-space:nowrap;z-index:6;animation:pop .25s cubic-bezier(.2,1.3,.4,1)}
.selbar .btn:hover{border-color:var(--blue);color:#cfe7ff}
.warnpop{position:absolute;left:0;right:0;margin:0 auto;top:64px;z-index:8;width:340px;max-width:calc(100% - 32px);background:var(--surface);border-radius:10px;box-shadow:inset 0 0 0 1px var(--line),0 16px 40px rgba(0,0,0,.5);padding:12px 14px;animation:pop .2s ease-out}
.warnpop h3{margin:0 0 2px;font-size:13px;font-weight:600}
.warnpop ul{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.warnpop li{font-size:12.5px;color:var(--text-2);line-height:1.45;display:flex;gap:8px}
.warnpop li::before{content:"!";font-family:var(--mono);color:#ffc98a;flex:none}
/* ---------- chat ---------- */
.chat-head{display:flex;align-items:center;gap:8px;padding:16px;border-bottom:1px solid var(--line-2)}
.chat-head h2{margin:0;font-size:14px;font-weight:600}
.chat-log{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-height:0}
.msg{max-width:92%;padding:9px 12px;border-radius:10px;line-height:1.5;font-size:13px;animation:rowpop .35s cubic-bezier(.2,1.4,.4,1) both}
.msg.me{align-self:flex-end;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line-3)}
.msg.bot{align-self:flex-start;background:transparent;color:var(--text-2);padding-left:0}
.msg.bot b{color:var(--text);font-weight:600}
.typingdots{display:inline-flex;gap:4px}
.think{margin-bottom:8px;border-left:2px solid rgba(167,139,250,.45);padding-left:10px}
.think summary{cursor:pointer;list-style:none;font-family:var(--mono);font-size:11px;color:var(--violet-ink);display:inline-flex;align-items:center;gap:6px;user-select:none}
.think summary::-webkit-details-marker{display:none}
.think summary::before{content:"▸";transition:transform .15s}
.think[open] summary::before{transform:rotate(90deg)}
.think:not([open]) .think-label{opacity:.8}
.think-body{margin-top:6px;max-height:220px;overflow:auto;white-space:pre-wrap;font-size:12px;line-height:1.5;color:var(--muted)}
.think-body b{color:var(--text-2);font-weight:600}
.typingdots i{width:6px;height:6px;border-radius:50%;background:var(--violet);animation:bob 1s ease-in-out infinite}
.typingdots i:nth-child(2){animation-delay:.15s;background:var(--teal)}
.typingdots i:nth-child(3){animation-delay:.3s;background:var(--pink)}
@keyframes bob{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-4px);opacity:1}}
.proposal{border-radius:10px;padding:12px;background:rgba(44,37,68,.45);box-shadow:inset 0 0 0 1px rgba(167,139,250,.45),0 0 24px rgba(139,92,246,.18);display:flex;flex-direction:column;gap:10px;animation:popai .6s cubic-bezier(.2,1.5,.35,1) both}
.proposal h3{margin:0;font-family:var(--mono);font-size:11px;font-weight:500;color:var(--violet-ink);display:flex;align-items:center;gap:6px}
.proposal h3 svg{width:12px;height:12px}
.proposal ul{margin:0;padding-left:16px;line-height:1.55;color:var(--text-2);font-size:12.5px}
.proposal.previewing{box-shadow:inset 0 0 0 1.5px var(--violet-hi),0 0 30px rgba(139,92,246,.32)}
.dnode{pointer-events:none;opacity:.82;background:rgba(30,27,44,.78);box-shadow:inset 0 0 0 1.5px rgba(167,139,250,.65),0 0 30px rgba(139,92,246,.22);animation:popai .6s cubic-bezier(.2,1.5,.35,1) both}
.dnode .nhead{background:rgba(44,37,68,.65)}
.dnode .dtitle{flex:1;min-width:0;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dnode .port{border-color:var(--violet-hi);border-style:dashed}
.dnode.dedit{opacity:1;background:#1e1b2c;box-shadow:inset 0 0 0 1.5px var(--violet-hi),0 0 30px rgba(139,92,246,.32)}
.dnode .orow{border-top-color:rgba(167,139,250,.18)}
.node.dunder{visibility:hidden}
.node.ddel{opacity:.4;box-shadow:inset 0 0 0 1.5px rgba(248,113,113,.85),0 0 26px rgba(248,113,113,.22)}
.node.ddel::after{content:"será removida";position:absolute;left:0;top:-22px;font-family:var(--mono);font-size:11px;color:#fca5a5;white-space:nowrap}
.proposal.building{animation:popai .6s cubic-bezier(.2,1.5,.35,1) both,glowpulse 1.6s ease-in-out .6s infinite}
.proposal.building h3 .typingdots{margin-left:4px}
.proposal.building h3 .typingdots i{width:4px;height:4px}
.proposal.building li.new{animation:rowpop .35s cubic-bezier(.2,1.4,.4,1) both}
.proposal.done{opacity:.55;box-shadow:inset 0 0 0 1px var(--line);background:transparent;animation:none}
.chat-form{display:flex;gap:8px;padding:12px 16px 16px;border-top:1px solid var(--line-2);align-items:flex-end}
.chat-form textarea{flex:1;min-height:40px;max-height:120px;resize:none;background:var(--well);border:1px solid var(--line);border-radius:8px;padding:9px 10px;line-height:1.4;outline:none}
.chat-form textarea:focus{border-color:var(--violet)}
/* ---------- modal ---------- */
.modal-wrap{position:fixed;inset:0;background:rgba(10,10,12,.78);display:grid;place-items:center;z-index:50;padding:16px;animation:fade .2s ease-out}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);border-radius:14px;box-shadow:inset 0 0 0 1px var(--line),0 24px 64px rgba(0,0,0,.5);width:min(780px,100%);max-height:min(88vh,100%);display:flex;flex-direction:column;min-height:0;animation:pop .32s cubic-bezier(.2,1.3,.4,1) both}
.modal.narrow{width:min(500px,100%)}
.modal.ai-glow{box-shadow:inset 0 0 0 1px rgba(167,139,250,.5),0 0 60px rgba(139,92,246,.25),0 24px 64px rgba(0,0,0,.5)}
.modal-head{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line-2)}
.modal-head h2{margin:0;font-size:15px;font-weight:600;flex:1}
.modal-body{padding:16px 20px;overflow:auto;display:flex;flex-direction:column;gap:14px;min-height:0}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line-2)}
.mk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.mk-card{border-radius:10px;overflow:hidden;display:flex;flex-direction:column;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);transition:transform .15s,box-shadow .15s}
.mk-card:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 1px var(--amber),0 10px 24px rgba(0,0,0,.4)}
.mk-art{aspect-ratio:16/10;background:var(--well);position:relative;overflow:hidden}
.mk-art img.full{width:100%;height:100%;object-fit:cover}
.mk-art .strip{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center}
.mk-art .strip img{height:92%;max-width:34%;object-fit:contain;object-position:bottom;margin:0 -6px}
.mk-info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:5px;flex:1}
.mk-info b{font-size:13.5px;font-weight:600}
.mk-info .hint{flex:1}
.emo-row{display:grid;grid-template-columns:1fr 1.6fr 24px;gap:6px;align-items:center}
.emo-row.fresh{animation:rowpop .4s cubic-bezier(.2,1.4,.4,1) both}
.gen-strip{display:flex;gap:6px;justify-content:center;padding:8px 0;min-height:120px;align-items:flex-end}
.gen-strip .slotph{width:64px;height:100px;border-radius:8px;background:linear-gradient(90deg,#2a2640 0%,#4a3f78 50%,#2a2640 100%);background-size:200% 100%;animation:shimmer 1s linear infinite}
.gen-strip img{width:64px;height:100px;object-fit:contain;object-position:bottom;animation:popai .6s cubic-bezier(.2,1.5,.35,1) both}
.suggest{background:rgba(44,37,68,.35);box-shadow:inset 0 0 0 1px rgba(167,139,250,.45);border-radius:8px;padding:10px 12px;line-height:1.5;font-size:14px}
.suggest .add{color:#efeaff}
.spinner{width:14px;height:14px;border:2px solid rgba(167,139,250,.3);border-top-color:var(--violet-hi);border-radius:50%;animation:spin .8s linear infinite}
/* ---------- play ---------- */
.play{position:fixed;inset:0;z-index:40;background:rgba(10,10,12,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));animation:fade .25s ease-out}
.phead{width:min(100%,calc((100vh - 140px)*16/9));display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.phead .grow{flex:1}
.pbtn{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line-3);background:transparent;color:#d6d4cf;font-size:13px;font-family:var(--sans)}
.pbtn:hover:not(:disabled){border-color:var(--amber);color:var(--amber-soft)}
.pbtn:disabled{opacity:.35;cursor:default}
.stage{position:relative;width:min(100%,calc((100vh - 140px)*16/9));aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line),0 24px 64px rgba(0,0,0,.5)}
.pic{position:absolute;inset:0}
.pic>.bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:bgin .5s ease-out both}
.stage .schar.dim{filter:brightness(.6) saturate(.85)}
.stage .schar{position:absolute;bottom:0;height:96%;transition:filter .3s;transform:translateX(-50%);object-fit:contain;object-position:bottom;animation:charin .5s cubic-bezier(.2,1.4,.4,1) both}
.tbox{position:absolute;left:3%;right:3%;bottom:4%;border-radius:12px;padding:18px 22px 16px;font-size:clamp(14px,1.7vw,19px);line-height:1.55;min-height:24%;animation:rowpop .35s cubic-bezier(.2,1.4,.4,1) both}
.tbox.dialogue{background:rgba(28,29,33,.94);box-shadow:inset 0 0 0 1px var(--line),0 12px 32px rgba(0,0,0,.45);color:var(--text)}
.tbox.narration{background:rgba(17,18,20,.72);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);color:#d5d1c8;font-style:italic;text-align:center;display:grid;place-items:center;backdrop-filter:blur(3px)}
.nametag{position:absolute;top:-15px;left:18px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line-3);border-radius:7px;padding:4px 12px;font-weight:600;font-style:normal;font-size:clamp(12px,1.4vw,15px)}
.tcaret{display:inline-block;width:.45em;height:1em;background:var(--amber);vertical-align:-.12em;margin-left:3px;animation:blink .6s steps(1) infinite}
.pchoices{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);display:flex;flex-direction:column;gap:8px;width:min(70%,460px)}
.pchoice{min-height:44px;text-align:left;padding:0 14px;border-radius:8px;border:1px solid var(--line-3);background:rgba(36,37,42,.95);color:var(--text);font-size:clamp(13px,1.4vw,15px);display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:rowpop .4s cubic-bezier(.2,1.4,.4,1) both}
.pchoice:hover:not(:disabled){border-color:var(--amber);background:#2b2a27}
.pchoice:disabled{opacity:.55;cursor:not-allowed}
.pnum{font-family:var(--mono);font-size:12px;color:var(--amber-soft);width:12px}
.pcont{position:absolute;right:4%;bottom:7%;z-index:2}
.pend{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,10,12,.55);animation:fade .4s ease-out}
.pend div{display:flex;flex-direction:column;align-items:center;gap:14px}
.pend span{font-family:var(--mono);font-size:15px;color:var(--text-2);letter-spacing:.1em}
/* toasts */
.toasts{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:80;align-items:center;pointer-events:none;width:min(560px,calc(100% - 32px))}
.toast{background:#26282e;color:#d6d4cf;padding:9px 13px;border-radius:8px;font-size:12.5px;box-shadow:0 0 0 1px #34363d,0 10px 24px rgba(0,0,0,.45);animation:pop .25s cubic-bezier(.2,1.3,.4,1);line-height:1.45;display:flex;gap:8px;align-items:flex-start}
.toast.err{background:var(--red-bg);color:#ffc4c4;box-shadow:0 0 0 1px rgba(255,107,107,.6),0 10px 24px rgba(0,0,0,.45)}
.toast.ai{background:#2a2142;color:#efe7ff;box-shadow:0 0 0 1px rgba(167,139,250,.7),0 0 22px rgba(167,139,250,.35)}
.only-narrow{display:none!important}
@container (max-width:1320px){.hide-mid{display:none!important}}
@container (max-width:1110px){.hide-lg{display:none!important}}
@container (max-width:780px){.hide-sm{display:none!important}}
@media (max-width:1180px){.app{--rwf:270px;--cwf:290px}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail,.chat{overflow:visible;opacity:1!important;pointer-events:auto!important}.rail>*,.chat>*{transform:none!important;width:100%}
  .rail,.chat{position:fixed;top:0;bottom:0;z-index:30;width:min(330px,88vw);transition:transform .25s cubic-bezier(.2,1,.3,1);box-shadow:0 0 40px rgba(0,0,0,.6)}
  .rail{left:0;transform:translateX(-105%)} .chat{right:0;transform:translateX(105%)}
  .rail.open,.chat.open{transform:none}
  .only-narrow{display:inline-flex!important}
  .hide-narrow{display:none!important}
}
@media (pointer:coarse){
  .canvas{-webkit-touch-callout:none}
  .port::after{inset:-20px}
  .nhead .iconbtn.sm::after{inset:-14px}
  .menu button{padding:12px 14px;font-size:15px}
  .node.holding{box-shadow:inset 0 0 0 2px var(--blue),0 0 0 6px rgba(108,182,255,.2);transition:box-shadow .45s}
  .addbtn.holding{border-color:var(--violet);color:#ede4ff;background:rgba(167,139,250,.12);transition:background .45s,border-color .45s}
}
@media (max-width:600px){
  .phead{flex-wrap:wrap}.phead>span:first-child{flex-basis:100%}
  .selbar{bottom:80px}
}
@media (max-width:600px) and (orientation:portrait){
  .play{justify-content:flex-start;overflow:auto;padding-top:max(16px,env(safe-area-inset-top,0px))}
  .play .stage{width:100%;aspect-ratio:auto;overflow:visible;background:none;box-shadow:none;border-radius:0;display:flex;flex-direction:column;gap:12px}
  .play .pic{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line),0 24px 64px rgba(0,0,0,.5)}
  .play .tbox{position:static;min-height:0;font-size:16px;padding:14px 16px}
  .play .pchoices{position:static;transform:none;width:100%}
  .play .pchoice{min-height:48px;font-size:15px}
  .play .pcont{position:static;display:flex;justify-content:flex-end}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* ---------- contas e histórias ---------- */
.screen{position:fixed;inset:0;z-index:40;background:var(--ink);overflow:auto}
.screen.center{display:grid;place-items:center;padding:16px}
#gate{z-index:41} /* acima da lista: também é o aviso de sessão expirada */
.screen[hidden]{display:none!important}
.gate-card{background:var(--surface);border-radius:14px;box-shadow:inset 0 0 0 1px var(--line);padding:28px;width:min(380px,100%);display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.gate-card p{margin:0;color:var(--text-2);line-height:1.5}
.gate-card .hint:empty{display:none}
/* Botão no padrão do Google para tema escuro: fundo #131314, borda #8e918f, logo colorido. */
.gbtn{height:40px;padding:0 14px 0 12px;border-radius:20px;background:#131314;border-color:#8e918f;color:#e3e3e3;font-weight:500;gap:10px;text-decoration:none}
.gbtn:hover{border-color:#e3e3e3;color:#fff}
.gbtn svg{width:18px;height:18px}
.home-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.who{display:flex;align-items:center;gap:8px;color:var(--text-2);min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.who img{width:24px;height:24px;border-radius:50%;flex:none}
.home-body{max-width:860px;margin:0 auto;padding:24px 16px}
.home-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.home-top h1{margin:0;font-size:18px;font-weight:600}
.stories{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.story{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:10px;box-shadow:inset 0 0 0 1px var(--line);padding:6px 10px 6px 6px;transition:box-shadow .12s}
.story:hover{box-shadow:inset 0 0 0 1px var(--amber)}
.sopen{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:8px;border-radius:7px;display:flex;flex-direction:column;gap:3px}
.sopen h3{margin:0;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{color:var(--muted);font-size:12px}
.empty{color:var(--muted);padding:32px 0;text-align:center}
.people-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.people-list li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line-2)}
.pinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pinfo b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.share-role{width:auto}
.share-link{display:flex;flex-direction:column;gap:10px;margin-top:4px;padding-top:14px;border-top:1px solid var(--line-2)}
.share-link h3{margin:0;font-size:13px;font-weight:600}
.link-box{display:flex;gap:14px;align-items:flex-start}
.link-box .qr{flex:none;width:132px;height:132px;background:#fff;border-radius:8px;overflow:hidden}
.link-box .qr svg{display:block;width:100%;height:100%}
.link-side{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.link-side .row .inp{flex:1;min-width:0}
@media (max-width:520px){.link-box{flex-direction:column;align-items:center}.link-side{width:100%}}
.app.ro #btnAddScene,.app.ro #chatForm{display:none}
/* askText/askConfirm: o form envolve cabeçalho, corpo e rodapé sem quebrar o flex do .modal */
.askform{display:contents}
.modal.ask{width:min(420px,100%)}
.ask-text{margin:0;color:var(--text-2);line-height:1.55}
.ask-text b{color:var(--text);font-weight:600}
/* O editor está no HTML, então o navegador o pintaria (com os dois painéis abertos) antes do
   script decidir a rota e o estado salvo dos painéis. Só aparece quando uma história abre. */
.boot .app{visibility:hidden}

<body>

<div class="app">
  <aside class="rail" id="rail" aria-label="Elenco e cenários">
    <div class="rail-top">
      <div class="brand"><strong>Roteiro</strong><span>visual novel</span><button class="iconbtn" id="railClose" aria-label="Recolher painel do elenco" title="Recolher painel" style="margin-left:auto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16"/><path class="chev0" d="M15 10l-2 2 2 2"/></svg></button></div>
      <div class="tabs" role="tablist"><button class="tab" role="tab" id="tabChars">Personagens <span class="n" id="nChars"></span></button><button class="tab" role="tab" id="tabBgs">Backgrounds <span class="n" id="nBgs"></span></button></div>
    </div>
    <div class="rail-actions" id="railActions"></div>
    <div class="rail-body" id="railBody"></div>
  </aside>

  <section class="canvas" id="canvas" aria-label="Grafo de cenas" tabindex="0">
    <div class="grid" id="grid"></div>
    <div class="shaker" id="shaker">
      <div class="world" id="world">
        <svg class="wires" id="wires" width="1" height="1" aria-hidden="true"></svg>
        <div class="fx" id="cuts"></div>
        <div id="nodes"></div>
        <div id="drafts"></div>
        <svg class="wires" id="dragwires" width="1" height="1" aria-hidden="true"></svg>
        <div class="fx" id="fx"></div>
      </div>
    </div>
    <div class="wash" id="wash"></div>
    <!-- Topo em três zonas: onde estou (título, salvamento) · o grafo · pessoas e ações. -->
    <div class="hud">
      <div class="hz hz-left">
        <button class="chip ptoggle" id="tglRail" aria-controls="rail" aria-expanded="true" title="Mostrar/ocultar elenco"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16"/><path class="chev" d="M15 10l-2 2 2 2"/></svg></button>
        <button class="chip ptoggle" id="btnHome" title="Voltar para suas histórias" aria-label="Voltar para suas histórias"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
        <div class="titlebox">
          <input class="title-in" id="storyTitle" aria-label="Título da história" placeholder="Sem título">

          <button class="sync" id="net" aria-live="polite"><span class="ndot"></span><span class="slabel">conectando…</span></button>
        </div>
      </div>
      <div class="hz hz-mid"><span class="stats" id="stats"></span></div>
      <div class="hz hz-right">
        <div class="people" id="people"></div>
        <button class="chip share" id="btnShare" title="Pessoas com acesso a esta história"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-6 6.5-6s5.9 2.4 6.5 6"/><path d="M19 8v6M16 11h6"/></svg><span>Compartilhar</span></button>
        <button class="chip" id="btnExport" title="Baixar a história como um arquivo HTML jogável (imagens embutidas)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>Exportar</button>
        <button class="playbtn" id="btnPlay"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>Jogar</button>
        <button class="chip ptoggle" id="btnHelp" title="Atalhos" aria-label="Atalhos" aria-haspopup="dialog" data-pop><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 014.8.9c0 1.7-2.4 2.2-2.4 3.6"/><path d="M12 17.2h.01"/></svg></button>

<div class="screen center" id="gate" hidden>
  <div class="gate-card">
